<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>رأس مالي</title>
<meta name="theme-color" content="#0f2a2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رأس مالي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ───────────── الألوان ───────────── */
:root{
  color-scheme: light;
  --bg:#eff2f0; --surface:#ffffff; --surface2:#f6f8f6;
  --ink:#12211f; --ink2:#465754; --muted:#7d8a86;
  --line:#e0e6e2; --axis:#c2ccc7;
  --total:#0f2a2c; --total-ink:#ffffff; --brass:#d9b25a;
  --dyaa:#0a6f69; --dz:#3a3fa8;
  --s-dyaa:#009488; --s-dz:#4a4fc4; --s-total:#12211f;
  --c-cash:#2a78d6; --c-omt:#eda100; --c-whish:#e87ba4; --c-ipick:#4a3aa7; --c-lana:#1baf7a; --c-alayna:#eb6834;
  --up:#0b7a45; --down:#c0352d; --up-bar:#17a05d; --down-bar:#d9453c;
  --up-bg:#e3f4ea; --down-bg:#fbe6e3;
  --warn-bg:#fff4d6; --warn-ink:#6b4c00;
  --accent:var(--btn); --btn:#0f2a2c;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0c1413; --surface:#17201f; --surface2:#1d2827;
    --ink:#f2f6f4; --ink2:#bcc8c4; --muted:#8c9995;
    --line:#293634; --axis:#3a4946;
    --total:#1f3a3c; --total-ink:#ffffff; --brass:#e0bd6c;
    --dyaa:#0b6b66; --dz:#3d42ad;
    --s-dyaa:#1fa39b; --s-dz:#7f86ee; --s-total:#f2f6f4;
    --c-cash:#3987e5; --c-omt:#c98500; --c-whish:#d55181; --c-ipick:#9085e9; --c-lana:#199e70; --c-alayna:#d95926;
    --up:#3ecf86; --down:#ff7b72; --up-bar:#1fa864; --down-bar:#e05a50;
    --up-bg:#143326; --down-bg:#3d1c1a;
    --warn-bg:#3a2f10; --warn-ink:#f4d98a; --btn:#2a7a74;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1413; --surface:#17201f; --surface2:#1d2827;
  --ink:#f2f6f4; --ink2:#bcc8c4; --muted:#8c9995;
  --line:#293634; --axis:#3a4946;
  --total:#1f3a3c; --total-ink:#ffffff; --brass:#e0bd6c;
  --dyaa:#0b6b66; --dz:#3d42ad;
  --s-dyaa:#1fa39b; --s-dz:#7f86ee; --s-total:#f2f6f4;
  --c-cash:#3987e5; --c-omt:#c98500; --c-whish:#d55181; --c-ipick:#9085e9; --c-lana:#199e70; --c-alayna:#d95926;
  --up:#3ecf86; --down:#ff7b72; --up-bar:#1fa864; --down-bar:#e05a50;
  --up-bg:#143326; --down-bg:#3d1c1a;
  --warn-bg:#3a2f10; --warn-ink:#f4d98a; --btn:#2a7a74;
}
body.shop-dyaa{--accent:var(--dyaa); --series:var(--s-dyaa)}
body.shop-dz{--accent:var(--dz); --series:var(--s-dz)}

/* ───────────── الأساس ───────────── */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.unit{font-size:.62em;font-weight:600;margin-inline-start:.28em;opacity:.8}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 96px}
.hide{display:none!important}

/* شريط العنوان */
.bar{display:flex;align-items:center;gap:8px;min-height:52px;margin-bottom:10px}
.bar h1{font-size:21px;font-weight:800;flex:1;line-height:1.3}
.bar .sub{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink2);background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:21px;height:21px}
.icon-btn:active{transform:scale(.96)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--up-bar)} .sync.err i{background:var(--down-bar)}

/* ───────────── كروت المحلات ───────────── */
.grid2{display:grid;gap:14px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.shop-card{position:relative;display:block;width:100%;text-align:start;color:#fff;border-radius:var(--r-lg);
  padding:18px 18px 0;overflow:hidden;min-height:214px}
.shop-card.dyaa{background:var(--dyaa)} .shop-card.dz{background:var(--dz)}
.shop-card.total{background:var(--total);color:var(--total-ink);cursor:default}
.shop-card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shop-card .name{font-size:18px;font-weight:700}
.shop-card .when{font-size:13px;font-weight:500;opacity:.82}
.shop-card .big{font-size:42px;font-weight:800;line-height:1.25;margin-top:6px;letter-spacing:-.01em}
.shop-card .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.shop-card .spark{display:block;width:calc(100% + 36px);margin:10px -18px 0;height:62px}
.shop-card .go{position:absolute;inset-inline-end:16px;top:50%;opacity:.55}
.shop-card .empty{font-size:15px;opacity:.9;margin-top:10px;max-width:26ch}
.shop-card .cta{display:inline-flex;align-items:center;gap:6px;margin:14px 0 18px;background:#fff;color:var(--ink);font-weight:700;border-radius:12px;padding:9px 16px;font-size:15px}
:root[data-theme="dark"] .shop-card .cta{color:#12211f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .shop-card .cta{color:#12211f}}
.shop-card .remind{font-size:13px;font-weight:600;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 11px}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;border-radius:99px;padding:3px 11px;white-space:nowrap}
.pill.up{background:var(--up-bg);color:var(--up)} .pill.down{background:var(--down-bg);color:var(--down)}
.pill.flat{background:var(--surface2);color:var(--ink2)}
.shop-card .pill.up{background:#fff;color:#0b7a45} .shop-card .pill.down{background:#fff;color:#c0352d}
.shop-card .pill.flat{background:rgba(255,255,255,.18);color:#fff}
.shop-card .soft{font-size:13px;opacity:.85;font-weight:500}
.total .brass{color:var(--brass)}
.split{display:flex;gap:18px;margin-top:12px;padding-bottom:16px;flex-wrap:wrap}
.split div{font-size:13px;opacity:.85} .split b{display:block;font-size:17px;font-weight:700;opacity:1}

/* ───────────── السطوح ───────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:14px}
.card h2{font-size:17px;font-weight:700;line-height:1.4}
.card h2.ic{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card h2.ic .tile{width:34px;height:34px;border-radius:10px;background:var(--surface2);color:var(--ink2)}
.card h2.ic .tile svg{width:19px;height:19px}
body.shop-dyaa .card h2.ic .tile,body.shop-dz .card h2.ic .tile{background:var(--surface2);background:color-mix(in srgb,var(--series) 14%,var(--surface));color:var(--series)}
.card .hint{font-size:13.5px;color:var(--muted);margin-top:2px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cols{display:grid;gap:14px}
.cols{margin-top:14px}.cols>.card{margin-top:0;min-width:0}
@media (min-width:900px){.cols{grid-template-columns:1.25fr 1fr;align-items:start}}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{font-size:13.5px;font-weight:600;padding:5px 12px;border-radius:8px;color:var(--ink2);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;font-size:16px;background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--down);border:1px solid var(--line)}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 14px;border-radius:12px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.5;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* صفحة المحل */
.hero{background:var(--accent);color:#fff;border-radius:var(--r-lg);padding:20px 20px 18px}
.hero .lab{font-size:14px;font-weight:600;opacity:.85}
.hero .big{font-size:clamp(44px,11vw,64px);font-weight:800;line-height:1.2;letter-spacing:-.015em}
.hero .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.hero .pill.up{background:#fff;color:#0b7a45}.hero .pill.down{background:#fff;color:#c0352d}.hero .pill.flat{background:rgba(255,255,255,.18);color:#fff}
.hero .soft{font-size:13.5px;opacity:.88}
.hero .split{padding-bottom:0;margin-top:16px;border-top:1px solid rgba(255,255,255,.22);padding-top:12px}
.hero .btn{background:#fff;color:var(--ink);margin-top:16px;width:100%}
:root[data-theme="dark"] .hero .btn{color:#12211f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .btn{color:#12211f}}
@media (min-width:760px){.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px}.hero .btn{width:auto;min-width:200px}}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-sm);padding:10px 14px;font-size:14.5px;font-weight:600;margin-top:12px}

/* لائحة الكشوفات */
.list{margin:6px -6px 0}
.list a{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 6px;border-top:1px solid var(--line);color:inherit;text-decoration:none;border-radius:8px}
.list a:first-child{border-top:0}
.list a:hover{background:var(--surface2)}
.list .d{font-weight:600;font-size:15px} .list .d small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.list .v{font-weight:700;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
table.t th{font-weight:600;color:var(--muted);font-size:13px;text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:end}
.up-t{color:var(--up);font-weight:700} .down-t{color:var(--down);font-weight:700}
.scroll-x{overflow-x:auto}

/* ───────────── الرسوم ───────────── */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible;outline-offset:4px}
.chart text{font-family:inherit;font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart text.n{direction:ltr;unicode-bidi:isolate}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5;direction:rtl}
.tip.on{opacity:1}
.tip .tt{font-size:12px;opacity:.75;margin-bottom:2px}
.tip .tr{display:flex;align-items:center;gap:7px}
.tip .tr b{font-weight:700;direction:ltr;unicode-bidi:isolate}
.tip .key{width:12px;height:0;border-top:2.5px solid;border-radius:2px;flex:none}
.tip .nm{opacity:.8;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:0;border-top:3px solid;border-radius:2px}
.legend i.sq{width:11px;height:11px;border:0;border-radius:3px}
.empty-chart{padding:26px 10px;text-align:center;color:var(--muted);font-size:14.5px}

/* وين مصرياتي */
.stack{display:flex;gap:2px;height:16px;margin:10px 0 4px}
.stack i{display:block;height:100%;min-width:3px}
.stack i:first-child{border-radius:0 4px 4px 0}.stack i:last-child{border-radius:4px 0 0 4px}.stack i:only-child{border-radius:4px}
.krow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.krow:first-of-type{border-top:0}
.krow i{width:11px;height:11px;border-radius:3px}
.krow b{font-weight:700;font-variant-numeric:tabular-nums}
.krow small{color:var(--muted);font-size:12.5px;min-width:3.2em;text-align:end;font-variant-numeric:tabular-nums}
.krow.sum{border-top:2px solid var(--line);font-weight:700}

/* مين السبب */
.cause{display:grid;grid-template-columns:5.6em 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.cause .track{height:14px;display:flex}
.cause .fill{height:100%;border-radius:4px 0 0 4px;min-width:2px}
.cause .fill.up{background:var(--up-bar)} .cause .fill.down{background:var(--down-bar)} .cause .fill.zero{background:var(--axis)}
.cause b{font-weight:700;font-variant-numeric:tabular-nums;min-width:5.5em;text-align:end}

/* ───────────── استمارة الكشف ───────────── */
:root{--h-cash:#1f66c4;--h-omt:#f0aa00;--h-omt-ink:#2a1d00;--h-whish:#b3246b;--h-ipick:#5b3fb3;--h-lana:#0c8054;--h-alayna:#c9471c}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.17)}
.tile svg{width:22px;height:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.amt{grid-template-columns:7fr 9fr}
.form-grid>.field{min-width:0}
/* رأس الكشف بلون المحل: مين المحل، التاريخ، سعر الصرف */
.fhead{background:var(--accent);color:#fff;border-radius:var(--r-lg);padding:16px 14px 14px}
.fhead .who{display:flex;align-items:center;gap:12px;margin:2px 2px 6px}
.fhead .who b{display:block;font-size:21px;font-weight:800;line-height:1.3}
.fhead .who span{display:block;font-size:13.5px;font-weight:600;opacity:.88}
.frow{position:relative;display:flex;align-items:center;gap:10px;background:#fff;color:#12211f;border-radius:14px;min-height:54px;padding:0 14px;margin-top:8px}
.frow .fl{font-size:13.5px;font-weight:700;color:#5b6a66;flex:none}
.frow .fv{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:54px;font-size:16px;font-weight:800;color:#12211f}
.frow .fv svg{width:20px;height:20px;color:#5b6a66;flex:none}
.frow input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;border:0;padding:0}
.frow input.rate{flex:1;min-width:0;min-height:54px;border:0;background:none;outline:0;padding:0;font-size:20px;font-weight:800;color:#12211f;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.frow input.rate::placeholder{color:#7d8a86;opacity:.7;font-weight:600;font-size:15px}
.frow .sfx{font-size:14px;font-weight:700;color:#7d8a86;flex:none}
.frow:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.fhead .fnote{font-size:12.5px;font-weight:500;opacity:.88;margin:8px 4px 0}
@media (min-width:640px){.fhead .rows{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
/* أقسام الكشف: عنوان عريض ملوّن لكل قسم، مع مجموع القسم بالدولار */
.secs{display:grid;gap:14px;margin-top:14px}
@media (min-width:900px){.secs{grid-template-columns:1fr 1fr}}
.sec{--sec:var(--h-cash);--sec-ink:#fff;--sec-tile:rgba(255,255,255,.2);background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.sec.omt{--sec:var(--h-omt);--sec-ink:var(--h-omt-ink);--sec-tile:rgba(0,0,0,.11)}
.sec.whish{--sec:var(--h-whish)} .sec.ipick{--sec:var(--h-ipick)}
.sec.lana{--sec:var(--h-lana)} .sec.alayna{--sec:var(--h-alayna)}
.sec-h{display:flex;align-items:center;gap:11px;background:var(--sec);color:var(--sec-ink);padding:10px 14px;min-height:68px}
.sec-h .tile{background:var(--sec-tile);width:40px;height:40px}
.sec-h .tt{flex:1;min-width:0;line-height:1.3}
.sec-h .tt b{display:block;font-size:21px;font-weight:800}
.sec-h .tt span{display:block;font-size:12.5px;font-weight:600;opacity:.92}
.sec-h .sub{flex:none;background:var(--sec-tile);border-radius:11px;padding:5px 11px;font-size:17px;font-weight:800;white-space:nowrap;line-height:1.45}
.sec-h .sub small{font-size:12.5px;font-weight:700;margin-inline-end:6px}
.sec-b{flex:1;padding:14px;background:var(--surface);background:color-mix(in srgb,var(--sec) 5%,var(--surface))}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.inwrap{position:relative}
.inwrap input{width:100%;min-height:54px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);
  padding:0 11px 0 36px;font-size:17px;font-weight:800;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.inwrap input[data-dec]{padding-left:27px}
@media (min-width:560px){.inwrap input{font-size:20px;padding:0 14px 0 46px}.inwrap input[data-dec]{padding-left:34px}}
.sec .inwrap input{border-color:color-mix(in srgb,var(--sec) 32%,var(--line))}
.inwrap input:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.sec .inwrap input:focus{border-color:var(--sec);box-shadow:0 0 0 3px color-mix(in srgb,var(--sec) 26%,transparent)}
.inwrap .sfx{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:var(--muted);pointer-events:none}
.sec .inwrap.pos input{border-color:var(--up-bar);background:color-mix(in srgb,var(--up-bar) 8%,var(--surface))}
.sec .inwrap.neg input{border-color:var(--down-bar);background:color-mix(in srgb,var(--down-bar) 8%,var(--surface))}
.field .last{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:1.4em}
.field .last:empty{display:none}
.inwrap input::placeholder{color:var(--muted);opacity:.45;font-weight:500}
.field textarea{width:100%;min-height:64px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);padding:10px 14px;font-size:15.5px;resize:vertical}
.field textarea:focus{border-color:var(--accent);outline:0}
.sign{display:flex;margin-bottom:6px;border-radius:11px;overflow:hidden;border:1.5px solid var(--line);background:var(--surface)}
.sign button{flex:1;font-size:14px;font-weight:800;min-height:38px;color:var(--ink2)}
/* حساب بعملة وحدة (Whish، iPick): لنا/علينا والمبلغ على نفس السطر */
.onerow{display:grid;grid-template-columns:7fr 9fr;gap:12px;align-items:stretch}
.onerow .sign{margin-bottom:0}

<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   رأس مالي — متابعة الوضع المادي لمحلّين
   ════════════════════════════════════════════════════════════ */
const APP_VERSION = 'v1.4 · 2026-10-07';
/* ═══ ربط Firebase ═══
   مشروع rasmal-1f2ef. الدخول بإيميل وكلمة سر (Authentication ← Email/Password)، والأرقام بـ Firestore تحت capital/{uid}/kashf.
   (إذا انحط null بدل الـ config، البرنامج بيشتغل على هالجهاز بس، بلا مزامنة.) */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAB9i4BshciBBlAeW9K8yqIOSPRVpCH4AM",
  authDomain: "rasmal-1f2ef.firebaseapp.com",
  projectId: "rasmal-1f2ef",
  storageBucket: "rasmal-1f2ef.firebasestorage.app",
  messagingSenderId: "908317005642",
  appId: "1:908317005642:web:0fb78846142fcb690f93b3"
};
const CLOUD = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
const SHOPS = [{id:'dyaa', name:'محل الضيعة'}, {id:'dz', name:'محل ديرزنون'}];
/* أقسام الكشف — هاللائحة هي المرجع الوحيد: منها بتطلع الخانات والحساب والرسوم وشاشة المراجعة.
   fu = خانة الدولار، fl = خانة اللبناني (القسم بعملة وحدة عندو وحدة منهن بس)، signed = بيكون لنا أو علينا. */
const SECS = [
  {k:'cash',   title:'كاش بالصندوق', short:'كاش',       sub:'المصاري الموجودة بالمحل',      fu:'cashUsd',   fl:'cashLbp'},
  {k:'omt',    title:'OMT',           short:'OMT',       sub:'حسابنا مع OMT: لنا أو علينا',  fu:'omtUsd',    fl:'omtLbp', signed:true},
  {k:'whish',  title:'Whish',         short:'Whish',     sub:'حسابنا مع Whish بالدولار',     fu:'whishUsd',  signed:true},
  {k:'ipick',  title:'iPick',         short:'iPick',     sub:'حسابنا مع iPick باللبناني',    fl:'ipickLbp',  signed:true},
  {k:'lana',   title:'دين لنا',       short:'دين لنا',   sub:'مصاري إلنا عند الناس',         fu:'lanaUsd',   fl:'lanaLbp'},
  {k:'alayna', title:'دين علينا',     short:'دين علينا', sub:'مصاري لازم ندفعها',            fu:'alaynaUsd', fl:'alaynaLbp'}
];
const FIELDS = [], SIGNED = {};
SECS.forEach(S => [S.fu, S.fl].forEach(f => { if(!f) return; FIELDS.push(f); if(S.signed) SIGNED[f] = true; }));
const FLABEL = {date:'التاريخ', rate:'سعر الصرف', note:'الملاحظة',
  cashUsd:'كاش $', cashLbp:'كاش ل.ل', omtUsd:'OMT $', omtLbp:'OMT ل.ل', whishUsd:'Whish $', ipickLbp:'iPick ل.ل',
  lanaUsd:'دين لنا $', lanaLbp:'دين لنا ل.ل', alaynaUsd:'دين علينا $', alaynaLbp:'دين علينا ل.ل'};
const LS_DATA = 'rasmali.data.v1', LS_PREFS = 'rasmali.prefs.v1';
const DAY = 86400000;
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const MSHORT = ['ك2','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','ت1','ت2','ك1'];

/* ───────────── التخزين ───────────── */
let recs = {};          // id → كشف
let prefs = {pin:null, pw:null, lk:null, auto:5, theme:'auto', acct:null, last:null};   // acct = الحساب المربوط بهالجهاز {uid, email}
function getCfg(){ return CLOUD ? FIREBASE_CONFIG : null; }
const IS_FILE = !/^https?:$/.test(location.protocol);
let storageOK = true;
function testStorage(){ try{ const k = 'rasmali.test'; localStorage.setItem(k, '1'); const ok = localStorage.getItem(k) === '1'; localStorage.removeItem(k); return ok; }catch(e){ return false; } }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function loadAll(){
  const d = lsGet(LS_DATA); recs = {};
  if(d && Array.isArray(d.recs)) d.recs.forEach(r => { const c = cleanRec(r); if(c) recs[c.id] = c; });
  const p = lsGet(LS_PREFS); if(p && typeof p === 'object') prefs = Object.assign(prefs, p);
}
function saveData(){ if(!lsSet(LS_DATA, {v:1, recs:Object.values(recs)})) toast('ما قدرنا نحفظ على هالجهاز'); }
function savePrefs(){ lsSet(LS_PREFS, prefs); }
function num(x){ x = Number(x); return isFinite(x) ? x : 0; }
/* يضمن إنو كل كشف جايي من التخزين أو السحابة أو نسخة احتياطية شكلو سليم */
function cleanRec(r){
  if(!r || typeof r !== 'object' || !r.id || !SHOPS.some(s => s.id === r.shop)) return null;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date || '')) return null;
  const o = {id:String(r.id), shop:r.shop, date:r.date, rate:Math.max(0, num(r.rate)),
    note: typeof r.note === 'string' ? r.note.slice(0, 500) : '',
    created:num(r.created) || num(r._m) || Date.now(), _m:num(r._m) || num(r.created) || Date.now(),
    _del: !!r._del, log: Array.isArray(r.log) ? r.log.filter(l => l && typeof l === 'object' && Array.isArray(l.ch)).slice(-60).map(l => ({t:num(l.t), ch:l.ch.filter(x => x && typeof x === 'object').map(x => ({f:String(x.f), a:(typeof x.a === 'number' ? x.a : String(x.a == null ? '' : x.a)), b:(typeof x.b === 'number' ? x.b : String(x.b == null ? '' : x.b))}))})) : []};
  FIELDS.forEach(f => { o[f] = num(r[f]); if(!SIGNED[f]) o[f] = Math.max(0, o[f]); });
  Object.keys(r).forEach(k => { if(!(k in o) && /^[a-z][A-Za-z0-9]*(Usd|Lbp)$/.test(k)) o[k] = num(r[k]); });
  return o;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ───────────── الحسابات ───────────── */
function calc(r){
  const rate = r.rate > 0 ? r.rate : 0, L = x => rate ? x / rate : 0, o = {usd:0, lbp:0};
  SECS.forEach(S => { const u = S.fu ? num(r[S.fu]) : 0, l = S.fl ? num(r[S.fl]) : 0, sg = S.k === 'alayna' ? -1 : 1;
    o[S.k] = u + L(l);                 // قيمة القسم بالدولار (دين علينا رقم موجب، وبينطرح من المجموع)
    o.usd += sg * u; o.lbp += sg * l; });
  o.total = o.usd + L(o.lbp);
  return o;
}
function ts(d){ const p = d.split('-'); return new Date(+p[0], +p[1]-1, +p[2]).getTime(); }
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function shopRecs(id){ return Object.values(recs).filter(r => r.shop === id && !r._del).sort((a,b) => ts(a.date) - ts(b.date) || a.created - b.created); }
function seriesOf(id){ return shopRecs(id).map(r => ({t: ts(r.date), v: calc(r).total, r})); }
/* القيمة بتاريخ معيّن: خط مستقيم بين كشفين، وبعد آخر كشف بتضل متل ما هي */
function valAt(s, t){
  if(!s.length || t < s[0].t) return null;
  if(t >= s[s.length-1].t) return s[s.length-1].v;
  for(let i = 1; i < s.length; i++){
    if(t <= s[i].t){ const a = s[i-1], b = s[i]; if(b.t === a.t) return b.v; return a.v + (b.v - a.v) * (t - a.t) / (b.t - a.t); }
  }
  return s[s.length-1].v;
}
/* قيمة حدّ الشهر: إذا في كشف بحدود ٣ أيام من أول الشهر مناخد رقمو متل ما هو (دقيق)، وإلا تقدير */
function boundary(s, B){
  if(B <= s[0].t) return {v:s[0].v, t:s[0].t, exact:true, p:s[0]};
  if(B >= s[s.length-1].t) return {v:s[s.length-1].v, t:s[s.length-1].t, exact:true, p:s[s.length-1]};
  let best = null;
  s.forEach(p => { const d = Math.abs(p.t - B); if(d <= 3.5*DAY && (!best || d < best.d || (d === best.d && p.t >= best.p.t))) best = {p, d}; });
  if(best) return {v:best.p.v, t:B, exact:true, p:best.p};
  return {v:valAt(s, B), t:B, exact:false};
}
function monthly(s){
  if(s.length < 2) return [];
  const out = [], first = new Date(s[0].t), last = new Date(s[s.length-1].t);
  let y = first.getFullYear(), m = first.getMonth();
  while(y < last.getFullYear() || (y === last.getFullYear() && m <= last.getMonth())){
    const A = new Date(y, m, 1).getTime(), B = new Date(y, m+1, 1).getTime();
    const a = boundary(s, A), b = boundary(s, B);
    if(!(a.p && a.p === b.p) && b.t > a.t) out.push({y, m, key:y*12+m, v:b.v - a.v, exact:a.exact && b.exact});
    m++; if(m > 11){ m = 0; y++; }
  }
  return out;
}
/* سلسلة المجموع للمحلّين: بتبلّش من يوم يلي صار لكل محل عندو كشف */
function totalSeries(){
  const ss = SHOPS.map(s => seriesOf(s.id)).filter(s => s.length);
  if(!ss.length) return [];
  const t0 = Math.max.apply(null, ss.map(s => s[0].t));
  const times = Array.from(new Set([].concat.apply([], ss.map(s => s.map(p => p.t))).filter(t => t >= t0))).sort((a,b) => a-b);
  return times.map(t => ({t, v: ss.reduce((sum, s) => sum + valAt(s, t), 0)}));
}
/* مقارنة كشفين: الفرق، الأيام، مين السبب، وأثر سعر الصرف */
function compare(prev, cur){
  const a = calc(prev), b = calc(cur);
  const days = Math.round((ts(cur.date) - ts(prev.date)) / DAY);
  const delta = b.total - a.total;
  const rateFx = (prev.rate > 0 && cur.rate > 0) ? a.lbp / cur.rate - a.lbp / prev.rate : 0;
  return { delta, days, monthlyRate: days >= 7 ? delta / days * 30.44 : null,
    parts: SECS.map(S => ({k:S.k, name:S.k === 'cash' ? 'الكاش' : S.short, v:(S.k === 'alayna' ? -1 : 1) * (b[S.k] - a[S.k])})),
    dUsd: b.usd - a.usd, dLbp: b.lbp - a.lbp, rateFx, rateChanged: prev.rate !== cur.rate };
}

/* ───────────── التنسيق ───────────── */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fnum(n, dec){ n = num(n); if(Math.abs(n) < 0.005) n = 0; return n.toLocaleString('en-US', {maximumFractionDigits: dec == null ? 0 : dec, minimumFractionDigits:0}); }
function usdTxt(n){ n = Math.round(num(n)); return (n < 0 ? '−' : '') + fnum(Math.abs(n)); }
function signTxt(n){ n = Math.round(num(n)); return (n > 0 ? '+' : n < 0 ? '−' : '') + fnum(Math.abs(n)); }
function usd(n){ return '<span class="num">' + usdTxt(n) + '</span><span class="unit">$</span>'; }
function usdS(n){ return '<span class="num">' + signTxt(n) + '</span><span class="unit">$</span>'; }
function lbp(n){ n = Math.round(num(n)); return '<span class="num">' + (n < 0 ? '−' : '') + fnum(Math.abs(n)) + '</span><span class="unit">ل.ل</span>'; }
function compact(n){ const a = Math.abs(n), s = n < 0 ? '−' : '';
  if(a >= 1e6) return s + (a/1e6).toLocaleString('en-US',{maximumFractionDigits:1}) + 'M';
  if(a >= 1e4) return s + (a/1e3).toLocaleString('en-US',{maximumFractionDigits:0}) + 'K';
  if(a >= 1e3) return s + (a/1e3).toLocaleString('en-US',{maximumFractionDigits:1}) + 'K';
  return s + fnum(a); }
function dateLong(d){ const p = d.split('-'); return (+p[2]) + ' ' + MONTHS[+p[1]-1] + ' ' + p[0]; }
function dateShortT(t){ const d = new Date(t); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function daysTxt(n){ n = Math.abs(n); return n === 1 ? 'يوم' : n === 2 ? 'يومين' : (n >= 3 && n <= 10) ? n + ' أيام' : n + ' يوم'; }
function agoTxt(n){ return n <= 0 ? 'اليوم' : n === 1 ? 'مبارح' : 'قبل ' + daysTxt(n); }
function pill(d, short){
  const r = Math.round(d);
  if(r === 0) return '<span class="pill flat">' + (short ? '=' : 'بلا تغيير') + '</span>';
  return '<span class="pill ' + (r > 0 ? 'up' : 'down') + '" ' + (short ? 'aria-label="' + (r > 0 ? 'طلوع' : 'نزول') + '"' : '') + '>' + (r > 0 ? '▲ ' : '▼ ') + (short ? '' : (r > 0 ? 'طلوع ' : 'نزول ')) + usd(Math.abs(r)) + '</span>';
}

function modal(html, onMount){

    const ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    const close = v => { ov.remove(); document.removeEventListener('keydown', key); resolve(v); };
    const key = e => { if(e.key === 'Escape') close(null); };

    $('#layer').appendChild(ov);

function niceTicks(lo, hi, n){
  if(hi === lo){ const p = Math.abs(hi) * 0.1 || 10; lo -= p; hi += p; }
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for(let v = a; v <= b + step * 0.001; v += step) t.push(Math.round(v / step) * step);
  return t;
}
function timeTicks(t0, t1, max){
  const out = [], span = t1 - t0;
  if(span <= 0) return [{t:t0, label:new Date(t0).getDate() + ' ' + MSHORT[new Date(t0).getMonth()]}];
  if(span < 50 * DAY){
    const step = Math.max(1, Math.ceil(span / DAY / max));
    for(let t = t0; t <= t1 + 1; t += step * DAY){ const d = new Date(t); out.push({t, label:d.getDate() + ' ' + MSHORT[d.getMonth()]}); }
    return out;
  }
  const a = new Date(t0), months = (new Date(t1).getFullYear() - a.getFullYear()) * 12 + new Date(t1).getMonth() - a.getMonth();
  const step = Math.max(1, Math.ceil(months / max));
  let y = a.getFullYear(), m = a.getMonth() + 1, lastY = null;
  for(;;){
    const d = new Date(y, m, 1), t = d.getTime(); if(t > t1) break;
    const yy = d.getFullYear();
    out.push({t, label:MSHORT[d.getMonth()] + (yy !== lastY ? ' ' + yy : '')}); lastY = yy;
    m += step;
  }
  return out;
}

function viewSnap(r){

/* ════════════════ المزامنة (Firebase) ════════════════ */
const FB_VER = '10.12.2';
const cloud = {
  state:'off', error:'', email:'', app:null, col:null, unsub:null, authUnsub:null, remoteM:{},
  set(st, err){ const ch = this.state !== st; this.state = st; this.error = err || ''; if(ch) softRender(); },
  sdkP:null,
  loadSdk(){ if(window.firebase && firebase.firestore) return Promise.resolve();
    if(this.sdkP) return this.sdkP;                                   // تحميل واحد بس، مهما كان عدد يلي طالبينو
    const one = n => new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-' + n + '-compat.js'; s.onload = ok; s.onerror = () => { s.remove(); no(new Error('ما قدرنا نتصل بالسيرفر')); }; document.head.appendChild(s); });
    this.sdkP = one('app').then(() => one('auth')).then(() => one('firestore')).catch(e => { this.sdkP = null; throw e; });
    return this.sdkP; },
  start(){ if(!CLOUD) return this.set('off'); this.set('connecting');
    this.loadSdk().then(() => {
      if(!this.app) this.app = firebase.apps.length ? firebase.app() : firebase.initializeApp(getCfg());
      if(this.authUnsub) this.authUnsub();
      this.authUnsub = firebase.auth().onAuthStateChanged(u => { this.detach();
        if(!u || !prefs.acct || u.uid !== prefs.acct.uid){ this.email = ''; return this.set('out'); }     // منزامن بس للحساب المربوط بهالجهاز
        this.email = u.email || ''; this.attach(u.uid); });
    }).catch(e => this.set('err', navigator.onLine === false ? 'ما في إنترنت — الأرقام محفوظة على الجهاز وبتتزامن بس يرجع' : (e.message || String(e)))); },
  attach(uid){ const db = firebase.firestore(); this.col = db.collection('capital').doc(uid).collection('kashf'); this.remoteM = {};
    this.unsub = this.col.onSnapshot(snap => { let changed = false; const seen = {};
      snap.forEach(d => { const r = cleanRec(Object.assign({}, d.data(), {id:d.id})); if(!r) return; seen[r.id] = r._m; const loc = recs[r.id]; if(!loc || r._m > loc._m){ recs[r.id] = r; changed = true; } });
      this.remoteM = seen;
      Object.values(recs).forEach(r => { if(!(r.id in seen) || r._m > seen[r.id]) this.push(r); });
      if(changed) saveData();
      const was = this.state; this.state = 'on'; this.error = '';
      if(changed || was !== 'on') softRender();
    }, e => { this.col = null; this.set('err', syncErr(e)); }); },
  detach(){ if(this.unsub){ try{ this.unsub(); }catch(e){} } this.unsub = null; this.col = null; },
  push(r){ if(!this.col) return; const data = JSON.parse(JSON.stringify(r)); this.remoteM[r.id] = r._m;
    this.col.doc(r.id).set(data).catch(e => { delete this.remoteM[r.id]; if(e && (e.code === 'permission-denied' || e.code === 'not-found')) this.set('err', syncErr(e)); }); },
  signIn(em, pw){ return this.loadSdk().then(() => { if(!this.app) this.app = firebase.apps.length ? firebase.app() : firebase.initializeApp(getCfg()); return firebase.auth().signInWithEmailAndPassword(em, pw); }); },
  signOut(){ if(window.firebase && firebase.auth) firebase.auth().signOut(); },
  stop(out){ this.detach(); if(this.authUnsub){ this.authUnsub(); this.authUnsub = null; } if(out) this.signOut(); this.state = 'off'; }
};
function syncErr(e){ const c = (e && e.code) || '';
  return ({'permission-denied':'ما في صلاحية بقاعدة البيانات', 'not-found':'قاعدة البيانات مش موجودة بالمشروع', 'failed-precondition':'قاعدة البيانات مش جاهزة بالمشروع', 'unavailable':'ما في اتصال بالسيرفر'})[c] || (e && e.message) || c || 'خطأ غير معروف'; }
/* إعادة رسم بلا ما نخرّب استمارة مفتوحة أو نافذة */
function softRender(){ const ae = document.activeElement;
  if(gate.locked){ pendingRender = true; return; }
  if(/\/(new|edit)(\/|$)/.test(location.hash) || $('.ov') || (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName))){ pendingRender = true; return; }
  pendingRender = false; const y = window.scrollY; route(); window.scrollTo(0, y); }
document.addEventListener('focusout', () => { if(pendingRender) setTimeout(() => { if(pendingRender) softRender(); }, 150); });

/* ════════════════ التشغيل ════════════════ */
storageOK = testStorage();
loadAll(); applyTheme();
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => onVis(document.hidden));
if(CLOUD && !prefs.acct) gateFirstLogin();                      // أول مرة على الجهاز: إيميل وكلمة سر
else if(hasCode()) gateLogin();                                 // كل فتحة: رمز الدخول
else { lockUI(); gateSetup({welcome:true, done:unlock}); }      // ما في رمز بعد: اختيارو إجباري
window.addEventListener('online', () => { if(booted && CLOUD && cloud.state === 'err') cloud.start(); });
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
